<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Titanium Obsidian Void) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f151f" />
      <stop offset="50%" stop-color="#080a0e" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>

    <!-- Primary Emerald Gradient for Letterform -->
    <linearGradient id="emeraldGrad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="centerGlow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Accent Dot -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="6" y="6" width="500" height="500" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Radial Backlight -->
  <circle cx="256" cy="256" r="200" fill="url(#centerGlow)" />

  <!-- Inner Architectural Grid Accents -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1.5">
    <circle cx="256" cy="256" r="160" />
    <line x1="256" y1="96" x2="256" y2="416" stroke-dasharray="6 6" />
  </g>

  <!-- Stylized Geometric "A" Lettermark & Systems Apex -->
  <!-- Left leg, apex, right leg, and crossbar -->
  <g stroke="url(#emeraldGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg to Apex to Right Leg -->
    <path d="M148 376 L256 128 L364 376" />
    <!-- Architectural Crossbar with Tech Notch -->
    <path d="M188 296 L324 296" />
  </g>

  <!-- Inner Apex Core Diamond (Tech Geometry) -->
  <polygon points="256,195 272,225 256,255 240,225" fill="#34d399" opacity="0.9" />

  <!-- Signature Brand Emerald Dot "A." (with luminous glow) -->
  <circle cx="406" cy="372" r="24" fill="#34d399" filter="url(#emeraldGlow)" />
  <circle cx="406" cy="372" r="20" fill="#6ee7b7" />
</svg>
